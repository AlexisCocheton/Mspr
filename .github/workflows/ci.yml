name: CI - MECHA Maintenance Prédictive

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Valider le fichier de règles métier
        run: python -c "from src.regles import charger_regles; charger_regles(); print('regles_metier.yaml valide')"

      - name: Lancer les tests
        run: |
          pytest tests/ -v --tb=short

  build-docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t mecha-predictive-maintenance .

      - name: Vérifier l'image (imports API, base de données, règles, entraînement)
        run: |
          docker run --rm mecha-predictive-maintenance \
            python -c "import src.api as a, src.bootstrap; assert a.DB_AVAILABLE, 'couche base de données non importable'; print('Image OK')"

      - name: Valider la configuration docker-compose
        run: docker compose config --quiet
